<section class="inputs" aria-label="計算条件"><fieldset><legend><span class="step">1</span> 現在の状態</legend><div class="grid current-inputs"><div id="rank-field"><label for="rank">現在のランク</label><input id="rank" inputmode="numeric" value="1000" autocomplete="off"></div><div id="xp-field"><label for="xp">累計経験値</label><input id="xp" inputmode="text" placeholder="例：10億5000万" autocomplete="off"></div></div><div id="current" class="current"></div></fieldset>

<section id="result" class="result" aria-live="polite"><p class="empty">経験値と周回数を入力すると、ここに結果が表示されます。</p></section>

 try{start=startMode==='rank'?C.xpOf(value('rank',1),T):value('xp',0);const rank=C.rankOf(start,T);if(startMode==='rank')$('xp').value=fmt(start);else $('rank').value=String(rank);$('current').innerHTML=(rank>3000?'現在の換算ランク <strong>':'現在ランク <strong>')+fmt(rank)+'</strong>　·　累計 '+fmt(start)+'<br>'+'次の'+(rank>=3000?'換算':'')+'ランクまで '+fmt(C.xpOf(rank+1,T)-start)+' 経験値';
 const targetXp=mode==='target'?syncTarget():undefined;
 const per=value('per',1),laps=value('laps',1);if(!Number.isSafeInteger(per*laps))throw Error('数値が大きすぎます。入力を小さくしてください。');$('per-bell').textContent='ベル1個で '+fmt(per*laps)+' 経験値';
 const r=C.calculate({start,per,laps,mode,bells:mode==='bells'?value('bells',0):0,targetXp},T);
 if(mode==='bells'){$('result').innerHTML='<p class="result-label">ベル '+fmt(r.count)+' 個での到達ランク</p><div class="big">'+fmt(r.rank)+(r.rank>3000?'<small>換算</small>':'')+'<span class="delta">＋'+fmt(r.rank-rank)+'</span></div>'+details([['総周回数',fmt(r.runs)+' 周'],['獲得経験値',fmt(r.earned)],['到達時の累計経験値',fmt(r.end)],['次のランクまで',fmt(C.xpOf(r.rank+1,T)-r.end)+' 経験値']]);}
 else{$('result').innerHTML='<p class="result-label">'+(targetMode==='rank'?'目標ランク '+fmt(value('target',1)):'目標累計 '+fmt(targetXp)+' 経験値')+' までに必要なベル</p><div class="big">'+fmt(r.count)+'<small>個</small></div>'+details([['必要周回数',fmt(r.runs)+' 周'],['目標までの必要経験値',fmt(r.need)],[r.rank>3000?'到達時の換算ランク':'到達時のランク',fmt(r.rank)],['到達時の累計経験値',fmt(r.end)]]);}
 if(rank>=3000||r.rank>=3000){$('result').innerHTML+='<p class="note">3,000以降は1ランク＝51,970,572経験値で換算した目安です。公式のランクとは異なります。</p>';}
 if(mode==='target')showDaily(r);
 }catch(e){$('result').innerHTML=e.message==='入力待ち'?'<p class="empty">必要な項目を入力すると、ここに結果が表示されます。</p>':'<p class="error"></p>';if(e.message!=='入力待ち')$('result').firstChild.textContent=e.message;}
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('bells-field').hidden=mode!=='bells';$('target-field').hidden=mode!=='target';$('deadline-field').hidden=mode!=='target';update();}));
ids.forEach(id=>$(id).addEventListener('input',()=>{if(id==='rank'||id==='xp'){startMode=id;$(id==='rank'?'xp':'rank').value='';}if(id==='target'||id==='target-xp'){targetMode=id==='target'?'rank':'xp';$(id==='target'?'target-xp':'target').value='';try{syncTarget();}catch{}}update();}));$('deadline').value=new Date((dayNumber(todayJst())+29)*DAY).toISOString().slice(0,10);$('deadline').min=todayJst();document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});syncTarget();update();
</script></body></html>
